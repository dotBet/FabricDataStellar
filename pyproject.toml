[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabric-data-stellar"
version = "0.1.0"
description = "Typed, metadata-driven dimensional modeling with a local DuckDB runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=2", "pytz>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[project.scripts]
data-stellar = "data_stellar.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_stellar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
